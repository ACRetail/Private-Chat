<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f2f2f2;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .login-box h2 {
      text-align: center;
      margin: 0 0 20px;
      color: #075e54;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #128c7e;
    }

    #loginButton {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #loginButton:disabled {
      opacity: 0.6;
    }

    #loginError {
      margin-top: 12px;
      color: #d32f2f;
      text-align: center;
      font-size: 14px;
    }


    /* =========================
       CHAT
    ========================= */

    #chatScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      height: 65px;
      background: #075e54;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #128c7e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-title {
      font-size: 17px;
      font-weight: bold;
    }

    .header-status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .header-actions button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
    }


    /* =========================
       MESSAGES
    ========================= */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .message {
      max-width: 75%;
      padding: 8px 10px 5px;
      border-radius: 9px;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.35;
    }

    .sent {
      align-self: flex-end;
      background: #dcf8c6;
      border-top-right-radius: 2px;
    }

    .received {
      align-self: flex-start;
      background: white;
      border-top-left-radius: 2px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      text-align: right;
      margin-top: 3px;
    }

    .gif-message {
      display: block;
      max-width: 240px;
      width: 100%;
      border-radius: 8px;
      margin-bottom: 3px;
    }


    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      background: #f0f0f0;
      padding: 8px;
      display: flex;
      gap: 7px;
      align-items: center;
      flex-shrink: 0;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 12px 15px;
      font-size: 15px;
    }

    .extra-buttons {
      display: flex;
      gap: 5px;
    }

    .extra-buttons button {
      border: none;
      background: transparent;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    #sendButton {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #128c7e;
      color: white;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }


    /* =========================
       GIF PANEL
    ========================= */

    #gifPanel {
      display: none;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px;
    }

    .gif-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .gif-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .gif-option {
      width: 110px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid transparent;
    }

    .gif-option:hover {
      border-color: #128c7e;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {
        height: 60px;
        padding: 0 10px;
      }

      .header-title {
        font-size: 15px;
      }

      .header-status {
        font-size: 11px;
      }

      .header-actions button {
        padding: 6px 8px;
      }

      #messages {
        padding: 10px;
      }

      .message {
        max-width: 85%;
      }

      .gif-option {
        width: 100px;
        height: 72px;
      }
    }
  </style>
</head>


<body>


  <!-- =========================
       LOGIN SCREEN
  ========================= -->

  <div id="loginScreen">

    <div class="login-box">

      <h2>🔒 Private Chat</h2>

      <input
        type="email"
        id="emailInput"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="passwordInput"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton">
        Login
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- =========================
       CHAT SCREEN
  ========================= -->

  <div id="chatScreen">


    <!-- HEADER -->

    <div class="header">

      <div class="header-left">

        <div class="profile">
          👤
        </div>

        <div>

          <div class="header-title">
            Private Chat
          </div>

          <div class="header-status">
            🔒 Only 2 people
          </div>

        </div>

      </div>


      <div class="header-actions">

        <button id="videoButton">
          📹
        </button>

        <button id="logoutButton">
          Logout
        </button>

      </div>

    </div>


    <!-- MESSAGES -->

    <div id="messages"></div>


    <!-- GIF PANEL -->

    <div id="gifPanel">

      <div class="gif-title">
        Choose a GIF
      </div>

      <div class="gif-list">

        <img
          class="gif-option"
          src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif"
          alt="GIF"
        >

        <img
          class="gif-option"
          src="https://media.giphy.com/media/26BRBKqUiq586bRVm/giphy.gif"
          alt="GIF"
        >

        <img
          class="gif-option"
          src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif"
          alt="GIF"
        >

        <img
          class="gif-option"
          src="https://media.giphy.com/media/3o7TKMt1VVNkHV2PaE/giphy.gif"
          alt="GIF"
        >

        <img
          class="gif-option"
          src="https://media.giphy.com/media/10UeedrT5MIfPG/giphy.gif"
          alt="GIF"
        >

      </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

      <div class="extra-buttons">

        <button id="gifButton">
          GIF
        </button>

      </div>

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendButton" disabled>
        ➤
      </button>

    </div>


  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      /*
        IMPORTANT:
        Yaha apni existing Firebase API key paste karo.
      */

      apiKey: "AIzaSyDNcItOQqGQOmDVToGJhvIt8_TZFXEhJyo",

      authDomain:
        "private-chat-4c4a8.firebaseapp.com",

      databaseURL:
        "https://private-chat-4c4a8-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "private-chat-4c4a8",

      storageBucket:
        "private-chat-4c4a8.firebasestorage.app",

      messagingSenderId:
        "333493856166",

      appId:
        "1:333493856166:web:a753d6dfc6db986c8b9167"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const chatScreen =
      document.getElementById("chatScreen");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const logoutButton =
      document.getElementById("logoutButton");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const gifButton =
      document.getElementById("gifButton");

    const gifPanel =
      document.getElementById("gifPanel");

    const videoButton =
      document.getElementById("videoButton");


    /* =========================
       CURRENT USER
    ========================= */

    let currentUser = null;

    let stopMessagesListener = null;


    /* =========================
       LOGIN
    ========================= */

    loginButton.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        loginError.textContent = "";

        if (!email || !password) {

          loginError.textContent =
            "Please enter email and password.";

          return;
        }

        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {

          console.error(error);

          loginError.textContent =
            "Login failed. Please check email and password.";

        }

        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

      }
    );


    /* ENTER TO LOGIN */

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          loginButton.click();

        }

      }
    );


    /* =========================
       AUTH STATE
    ========================= */

    onAuthStateChanged(
      auth,
      (user) => {

        /* Stop previous listener */

        if (stopMessagesListener) {

          stopMessagesListener();

          stopMessagesListener = null;

        }


        /* Clear old screen */

        messages.innerHTML = "";


        currentUser = user;


        if (user) {

          /* SHOW CHAT */

          loginScreen.style.display =
            "none";

          chatScreen.style.display =
            "flex";

          sendButton.disabled = false;

          messageInput.focus();


          /*
            Start realtime listener
            only after login.
          */

          stopMessagesListener =
            onChildAdded(
              messagesRef,
              (snapshot) => {

                const data =
                  snapshot.val();

                if (!data) {
                  return;
                }

                showMessage(data);

              }
            );


        } else {

          /* SHOW LOGIN */

          loginScreen.style.display =
            "flex";

          chatScreen.style.display =
            "none";

          sendButton.disabled = true;

          gifPanel.style.display =
            "none";

        }

      }
    );


    /* =========================
       SHOW MESSAGE
    ========================= */

    function showMessage(data) {

      const messageBox =
        document.createElement("div");


      if (
        currentUser &&
        data.sender === currentUser.uid
      ) {

        messageBox.className =
          "message sent";

      } else {

        messageBox.className =
          "message received";

      }


      /* GIF */

      if (
        data.type === "gif" &&
        data.gifUrl
      ) {

        const gif =
          document.createElement("img");

        gif.className =
          "gif-message";

        gif.src =
          data.gifUrl;

        gif.alt =
          "GIF";

        gif.loading =
          "lazy";

        messageBox.appendChild(gif);


      } else {

        /* TEXT */

        const textElement =
          document.createElement("div");

        textElement.className =
          "message-text";

        /*
          textContent keeps messages safe.
        */

        textElement.textContent =
          data.text || "";

        messageBox.appendChild(
          textElement
        );

      }


      /* TIME */

      const timeElement =
        document.createElement("div");

      timeElement.className =
        "message-time";

      timeElement.textContent =
        formatTime(data.timestamp);


      messageBox.appendChild(
        timeElement
      );


      messages.appendChild(
        messageBox
      );


      /* Scroll latest */

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       TIME
    ========================= */

    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      const date =
        new Date(timestamp);

      return date.toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =========================
       SEND TEXT MESSAGE
    ========================= */

    async function sendMessage() {

      if (!currentUser) {
        return;
      }

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }

      sendButton.disabled = true;

      try {

        await push(
          messagesRef,
          {

            type: "text",

            text: text,

            sender:
              currentUser.uid,

            email:
              currentUser.email || "",

            timestamp:
              Date.now()

          }
        );


        messageInput.value = "";

        messageInput.focus();


      } catch (error) {

        console.error(error);

        alert(
          "Message send failed."
        );

      }

      sendButton.disabled = false;

    }


    /* SEND BUTTON */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER TO SEND */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       GIF PANEL
    ========================= */

    gifButton.addEventListener(
      "click",
      () => {

        if (
          gifPanel.style.display ===
          "block"
        ) {

          gifPanel.style.display =
            "none";

        } else {

          gifPanel.style.display =
            "block";

        }

      }
    );


    /* =========================
       SEND GIF
    ========================= */

    document
      .querySelectorAll(".gif-option")
      .forEach(
        (gif) => {

          gif.addEventListener(
            "click",
            async () => {

              if (!currentUser) {
                return;
              }

              const gifUrl =
                gif.src;

              try {

                await push(
                  messagesRef,
                  {

                    type: "gif",

                    gifUrl:
                      gifUrl,

                    sender:
                      currentUser.uid,

                    email:
                      currentUser.email || "",

                    timestamp:
                      Date.now()

                  }
                );


                gifPanel.style.display =
                  "none";


              } catch (error) {

                console.error(error);

                alert(
                  "GIF send failed."
                );

              }

            }
          );

        }
      );


    /* =========================
       LOGOUT
    ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================
       VIDEO CALL
       NEXT STEP
    ========================= */

    videoButton.addEventListener(
      "click",
      () => {

        alert(
          "Video call next step me add karenge."
        );

      }
    );

  </script>

</body>
</html>
