<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e5ddd5;
    }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .login-box h2 {
      text-align: center;
      margin-top: 0;
      color: #075e54;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-box button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #loginError {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }

    /* CHAT */
    #chatScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      height: 65px;
      background: #075e54;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #128c7e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header-title {
      font-size: 17px;
      font-weight: bold;
    }

    .header-status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .header button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .message {
      max-width: 75%;
      padding: 8px 10px 5px;
      border-radius: 9px;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.35;
    }

    .sent {
      align-self: flex-end;
      background: #dcf8c6;
      border-top-right-radius: 2px;
    }

    .received {
      align-self: flex-start;
      background: white;
      border-top-left-radius: 2px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      text-align: right;
      margin-top: 3px;
    }

    /* INPUT */
    .input-area {
      background: #f0f0f0;
      padding: 8px;
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 12px 15px;
      font-size: 15px;
    }

    #sendButton {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #128c7e;
      color: white;
      font-size: 19px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .extra-buttons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .extra-buttons button {
      border: none;
      background: transparent;
      font-size: 21px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 85%;
      }

      .header {
        height: 60px;
      }

      #messages {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-box">

      <h2>🔒 Private Chat</h2>

      <input
        type="email"
        id="emailInput"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="passwordInput"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton">Login</button>

      <div id="loginError"></div>

    </div>
  </div>


  <!-- CHAT -->
  <div id="chatScreen">

    <div class="header">

      <div class="header-left">

        <div class="profile">👤</div>

        <div>
          <div class="header-title">Private Chat</div>
          <div class="header-status">🔒 Only 2 people</div>
        </div>

      </div>

      <div>
        <button id="videoButton">📹</button>
        <button id="logoutButton">Logout</button>
      </div>

    </div>


    <div id="messages"></div>


    <div class="input-area">

      <div class="extra-buttons">
        <button id="gifButton" title="GIF">GIF</button>
      </div>

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendButton" disabled>➤</button>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* FIREBASE */

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_EXISTING_API_KEY",
      authDomain: "private-chat-4c4a8.firebaseapp.com",
      databaseURL: "https://private-chat-4c4a8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "private-chat-4c4a8",
      storageBucket: "private-chat-4c4a8.firebasestorage.app",
      messagingSenderId: "333493856166",
      appId: "1:333493856166:web:a753d6dfc6db986c8b9167"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    /* ELEMENTS */

    const loginScreen = document.getElementById("loginScreen");
    const chatScreen = document.getElementById("chatScreen");

    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");

    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");

    const logoutButton = document.getElementById("logoutButton");

    const messages = document.getElementById("messages");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    /* CURRENT USER */

    let currentUser = null;

    let stopMessagesListener = null;


    /* LOGIN */

    loginButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginError.textContent = "";

      if (!email || !password) {
        loginError.textContent = "Please enter email and password.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Login failed. Please check email and password.";

      }

      loginButton.disabled = false;
      loginButton.textContent = "Login";

    });


    /* ENTER KEY LOGIN */

    passwordInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        loginButton.click();
      }

    });


    /* AUTH STATE */

    onAuthStateChanged(auth, (user) => {

      /* Stop old listener */

      if (stopMessagesListener) {
        stopMessagesListener();
        stopMessagesListener = null;
      }

      /* Clear old messages */

      messages.innerHTML = "";

      currentUser = user;

      if (user) {

        /* SHOW CHAT */

        loginScreen.style.display = "none";
        chatScreen.style.display = "flex";

        sendButton.disabled = false;

        messageInput.focus();


        /*
          Start Firebase listener only
          after login is confirmed.
        */

        stopMessagesListener = onChildAdded(
          messagesRef,
          (snapshot) => {

            const data = snapshot.val();

            if (!data) return;

            showMessage(data);

          }
        );

      } else {

        /* SHOW LOGIN */

        loginScreen.style.display = "flex";
        chatScreen.style.display = "none";

        sendButton.disabled = true;

      }

    });


    /* SHOW MESSAGE */

    function showMessage(data) {

      const messageBox = document.createElement("div");

      /*
        Compare with the UID captured
        from the currently logged-in user.
      */

      if (
        currentUser &&
        data.sender === currentUser.uid
      ) {

        messageBox.className = "message sent";

      } else {

        messageBox.className = "message received";

      }


      const textElement = document.createElement("div");

      textElement.className = "message-text";

      /*
        textContent is used instead of innerHTML
        for safety.
      */

      textElement.textContent = data.text || "";


      const timeElement = document.createElement("div");

      timeElement.className = "message-time";

      timeElement.textContent = formatTime(data.timestamp);


      messageBox.appendChild(textElement);
      messageBox.appendChild(timeElement);

      messages.appendChild(messageBox);


      /* Scroll to latest message */

      messages.scrollTop = messages.scrollHeight;

    }


    /* FORMAT TIME */

    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      const date = new Date(timestamp);

      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    /* SEND MESSAGE */

    async function sendMessage() {

      if (!currentUser) {
        return;
      }

      const text = messageInput.value.trim();

      if (!text) {
        return;
      }

      sendButton.disabled = true;

      try {

        await push(messagesRef, {

          text: text,

          sender: currentUser.uid,

          email: currentUser.email || "",

          timestamp: Date.now()

        });

        messageInput.value = "";

        messageInput.focus();

      } catch (error) {

        console.error(error);

        alert("Message send failed.");

      }

      sendButton.disabled = false;

    }


    /* SEND BUTTON */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER TO SEND */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* LOGOUT */

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* GIF BUTTON - FOR NEXT STEP */

    document
      .getElementById("gifButton")
      .addEventListener("click", () => {

        alert("GIF feature next step me add karenge.");

      });


    /* VIDEO BUTTON - FOR NEXT STEP */

    document
      .getElementById("videoButton")
      .addEventListener("click", () => {

        alert("Video call next step me add karenge.");

      });

  </script>

</body>
</html>
