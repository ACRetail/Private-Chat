
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>Private Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{
  position:fixed;inset:0;display:flex;align-items:center;
  justify-content:center;padding:20px;
  background:linear-gradient(145deg,#075e54,#111b21)
}
.loginCard{
  width:100%;max-width:380px;background:#fff;border-radius:18px;
  padding:30px 23px;text-align:center;box-shadow:0 15px 50px #0005
}
.loginLogo{font-size:45px}
.loginCard h1{color:#075e54;margin:12px 0 5px}
.loginCard p{color:#667781;font-size:14px;margin-bottom:25px}
.loginCard input{
  width:100%;padding:14px;margin-bottom:12px;border:1px solid #ddd;
  border-radius:9px;outline:none
}
.loginCard input:focus{border-color:#00a884}
.loginCard button{
  width:100%;border:0;background:#00a884;color:white;
  padding:14px;border-radius:9px;font-weight:bold
}
#error{color:#d32f2f;font-size:13px;margin-top:12px}

/* APP */
#chatScreen{
  position:fixed;top:0;left:0;width:100%;
  height:100dvh;display:flex;justify-content:center;
  background:#111b21;overflow:hidden
}
.chat{
  width:100%;max-width:950px;height:100%;
  display:flex;flex-direction:column;overflow:hidden;
  background:#efeae2
}

/* FIXED HEADER */
.header{
  flex:0 0 62px;height:62px;background:#075e54;
  display:flex;align-items:center;padding:0 10px;
  color:white;gap:10px;z-index:5
}
.avatar{
  width:41px;height:41px;border-radius:50%;
  background:#dfe9e5;color:#075e54;display:flex;
  align-items:center;justify-content:center;font-size:23px;
  flex-shrink:0
}
.contact{flex:1;min-width:0}
.contactName{
  font-weight:bold;font-size:17px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis
}
#status{font-size:12px;opacity:.85;margin-top:4px}
.headerButton{
  border:0;background:transparent;color:white;
  font-size:21px;padding:6px;flex-shrink:0
}

/* CHAT BACKGROUND */
.messages{
  flex:1;min-height:0;overflow-y:auto;
  overscroll-behavior:contain;
  padding:15px 12px;
  background-color:#efeae2;
  background-image:
    radial-gradient(#b8b0a536 1px,transparent 1px),
    radial-gradient(#b8b0a526 1px,transparent 1px);
  background-size:38px 38px,55px 55px;
  background-position:0 0,18px 23px;
  scrollbar-width:thin
}
.date{
  width:max-content;max-width:90%;
  margin:10px auto 17px;padding:7px 12px;
  background:#fffdf4;color:#54656f;
  font-size:12px;border-radius:8px;
  box-shadow:0 1px 2px #0002
}
.msgRow{display:flex;margin:4px 0}
.msgRow.mine{justify-content:flex-end}
.msgRow.theirs{justify-content:flex-start}
.bubble{
  max-width:82%;min-width:75px;padding:7px 8px 5px;
  border-radius:9px;box-shadow:0 1px 1px #0002;
  font-size:14.5px;line-height:1.42;overflow-wrap:anywhere
}
.mine .bubble{background:#d9fdd3;border-top-right-radius:2px}
.theirs .bubble{background:white;border-top-left-radius:2px}
.msgText{white-space:pre-wrap}
.meta{
  display:flex;justify-content:flex-end;align-items:center;
  gap:4px;font-size:10px;color:#667781;
  margin-top:3px;min-height:12px
}
.ticks{font-size:13px;letter-spacing:-3px;padding-right:3px}
.ticks.read{color:#53bdeb}
.empty{text-align:center;color:#667781;margin:30vh 0;font-size:13px}

/* TYPING */
#typingBubble{
  display:none;width:62px;background:white;
  padding:13px;margin:7px 0;border-radius:10px;
  box-shadow:0 1px 2px #0002
}
.dots{display:flex;gap:4px}
.dots span{
  width:7px;height:7px;border-radius:50%;background:#8696a0;
  animation:jump 1s infinite
}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes jump{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

/* INPUT STAYS ABOVE KEYBOARD */
.composer{
  flex:0 0 auto;display:flex;align-items:flex-end;
  gap:7px;padding:7px 8px;
  padding-bottom:max(7px,env(safe-area-inset-bottom));
  background:#f0f2f5
}
.inputBox{
  flex:1;min-width:0;display:flex;align-items:center;
  background:white;border-radius:25px;padding:3px 7px
}
.inputIcon{
  background:none;border:0;color:#8696a0;
  font-size:23px;padding:8px
}
#messageInput{
  flex:1;min-width:0;border:0;outline:0;
  padding:11px 4px;font-size:15px;background:transparent
}
.send{
  border:0;background:#00a884;color:white;
  width:45px;height:45px;border-radius:50%;
  font-size:21px;flex-shrink:0
}
#emojiPanel{
  display:none;background:#fff;padding:12px;
  border-top:1px solid #ddd;max-height:175px;overflow-y:auto
}
.emojiGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.emojiGrid button{background:none;border:0;font-size:24px}
@media(min-width:951px){
  .chat{box-shadow:0 0 35px #0005}
}
@media(max-width:360px){
  .header{gap:6px;padding:0 7px}
  .headerButton{font-size:19px;padding:4px}
  .bubble{max-width:88%}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="loginCard">
    <div class="loginLogo">💚</div>
    <h1>Private Chat</h1>
    <p>Just you and your special person ❤️</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div id="error"></div>
  </div>
</section>

<section id="chatScreen" class="hidden">
  <div class="chat" id="chat">
    <header class="header">
      <div class="avatar">❤️</div>
      <div class="contact">
        <div class="contactName">Private Chat</div>
        <div id="status">Connecting...</div>
      </div>
      <button class="headerButton" id="clearBtn" title="Clear chat">⋮</button>
      <button class="headerButton" id="logoutBtn" title="Logout">↪</button>
    </header>

    <main class="messages" id="messages">
      <div id="typingBubble">
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </main>

    <div id="emojiPanel">
      <div class="emojiGrid" id="emojiGrid"></div>
    </div>

    <footer class="composer">
      <div class="inputBox">
        <button class="inputIcon" id="emojiBtn">☺</button>
        <input id="messageInput" type="text"
          placeholder="Message" autocomplete="off">
      </div>
      <button class="send" id="sendBtn">➤</button>
    </footer>
  </div>
</section>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,ref,push,onChildAdded,onChildChanged,
  onChildRemoved,onValue,set,update,remove,onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDNcItOQqGQOmDVToGJhvIt8_TZFXEhJyo",
  authDomain:"private-chat-4c4a8.firebaseapp.com",
  databaseURL:"https://private-chat-4c4a8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"private-chat-4c4a8",
  storageBucket:"private-chat-4c4a8.firebasestorage.app",
  messagingSenderId:"333493856166",
  appId:"1:333493856166:web:a753d6dfc6db986c8b9167"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const USER1="4kQ8bajQmPgYzhej526WHTofvWW2";
const USER2="4S0l5VRvoPQdQ1qE8XaypIZprD33";

const $=id=>document.getElementById(id);
const messages=$("messages");
const typingBubble=$("typingBubble");
const input=$("messageInput");

let user=null;
let unsub=[];
let typingTimer=null;
let otherPresence=null;
let otherTyping=false;
let dates=new Set();
let messageCount=0;
let initialLoading=false;

const otherUid=()=>user?.uid===USER1?USER2:USER1;

function dateKey(ts){
  const d=new Date(ts);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function dateLabel(ts){
  const now=new Date();
  const yesterday=new Date();
  yesterday.setDate(now.getDate()-1);
  if(dateKey(ts)===dateKey(now))return "Today";
  if(dateKey(ts)===dateKey(yesterday))return "Yesterday";
  return new Date(ts).toLocaleDateString("en-IN",{
    day:"numeric",month:"long",year:"numeric"
  });
}

function time(ts){
  return new Date(ts).toLocaleTimeString("en-IN",{
    hour:"numeric",minute:"2-digit"
  });
}

function nearBottom(){
  return messages.scrollHeight-messages.scrollTop-messages.clientHeight<130;
}

function scrollBottom(){
  messages.scrollTop=messages.scrollHeight;
}

function refreshStatus(){
  if(otherTyping){
    $("status").textContent="typing...";
    return;
  }
  if(otherPresence?.online){
    $("status").textContent="online";
  }else if(otherPresence?.lastSeen){
    $("status").textContent=
      "last seen "+dateLabel(otherPresence.lastSeen).toLowerCase()+
      " at "+time(otherPresence.lastSeen);
  }else{
    $("status").textContent="offline";
  }
}

function resetMessages(){
  messages.replaceChildren(typingBubble);
  typingBubble.style.display="none";
  dates.clear();
  messageCount=0;
}

function addDate(ts){
  const key=dateKey(ts);
  if(dates.has(key))return;
  dates.add(key);
  const el=document.createElement("div");
  el.className="date";
  el.textContent=dateLabel(ts);
  messages.insertBefore(el,typingBubble);
}

function renderMessage(key,data){
  if(!user||!data||typeof data.text!=="string")return;
  if(document.getElementById("msg-"+key))return;

  const stick=initialLoading||nearBottom();
  const empty=messages.querySelector(".empty");
  if(empty)empty.remove();

  addDate(data.timestamp||Date.now());

  const mine=data.sender===user.uid;
  const row=document.createElement("div");
  row.className="msgRow "+(mine?"mine":"theirs");
  row.id="msg-"+key;

  const bubble=document.createElement("div");
  bubble.className="bubble";

  const text=document.createElement("div");
  text.className="msgText";
  text.textContent=data.text;

  const meta=document.createElement("div");
  meta.className="meta";

  const clock=document.createElement("span");
  clock.textContent=time(data.timestamp||Date.now());
  meta.appendChild(clock);

  if(mine){
    const ticks=document.createElement("span");
    ticks.className="ticks"+(data.read?" read":"");
    ticks.textContent=data.read?"✓✓":"✓";
    meta.appendChild(ticks);
  }

  bubble.append(text,meta);
  row.appendChild(bubble);
  messages.insertBefore(row,typingBubble);
  messageCount++;

  if(stick)requestAnimationFrame(scrollBottom);

  if(!mine&&!data.read){
    update(ref(db,"messages/"+key),{read:true})
      .catch(console.error);
  }
}

function updateTicks(key,data){
  const row=document.getElementById("msg-"+key);
  const ticks=row?.querySelector(".ticks");
  if(ticks){
    ticks.textContent=data.read?"✓✓":"✓";
    ticks.classList.toggle("read",!!data.read);
  }
}

function showEmpty(){
  if(messageCount>0||messages.querySelector(".empty"))return;
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent="🔒 Messages are private to your chat";
  messages.insertBefore(empty,typingBubble);
}

function listenMessages(){
  initialLoading=true;
  const msgRef=ref(db,"messages");

  unsub.push(onChildAdded(msgRef,s=>{
    if(s.key?.startsWith("__"))return;
    renderMessage(s.key,s.val());
  }));

  unsub.push(onChildChanged(msgRef,s=>{
    if(s.key?.startsWith("__"))return;
    updateTicks(s.key,s.val());
  }));

  unsub.push(onChildRemoved(msgRef,s=>{
    if(s.key?.startsWith("__"))return;
    document.getElementById("msg-"+s.key)?.remove();
    messageCount=Math.max(0,messageCount-1);
    if(messageCount===0){
      messages.querySelectorAll(".date").forEach(e=>e.remove());
      dates.clear();
      showEmpty();
    }
  }));

  unsub.push(onValue(msgRef,()=>{
    if(initialLoading){
      initialLoading=false;
      showEmpty();
      requestAnimationFrame(scrollBottom);
    }
  },{onlyOnce:true}));
}

async function setTyping(value){
  if(!user)return;
  try{
    await set(ref(db,"messages/__typing__/"+user.uid),{
      typing:value,timestamp:Date.now()
    });
  }catch(e){console.error(e)}
}

function listenPresence(){
  const myRef=ref(db,"messages/__presence__/"+user.uid);
  const theirRef=ref(db,"messages/__presence__/"+otherUid());
  const myTyping=ref(db,"messages/__typing__/"+user.uid);
  const theirTyping=ref(db,"messages/__typing__/"+otherUid());

  // Re-register presence whenever Firebase reconnects.
  unsub.push(onValue(ref(db,".info/connected"),async s=>{
    if(!s.val()||!user)return;
    try{
      await onDisconnect(myRef).set({
        online:false,lastSeen:Date.now()
      });
      await onDisconnect(myTyping).set({
        typing:false,timestamp:Date.now()
      });
      await set(myRef,{online:true,lastSeen:Date.now()});
    }catch(e){console.error(e)}
  }));

  unsub.push(onValue(theirRef,s=>{
    otherPresence=s.val();
    refreshStatus();
  }));

  unsub.push(onValue(theirTyping,s=>{
    const d=s.val();
    otherTyping=!!(d?.typing&&Date.now()-d.timestamp<10000);
    typingBubble.style.display=otherTyping?"block":"none";
    refreshStatus();
    if(otherTyping&&nearBottom())scrollBottom();
  }));
}

async function send(){
  if(!user)return;
  const text=input.value.trim();
  if(!text)return;

  input.value="";
  clearTimeout(typingTimer);
  setTyping(false);

  try{
    await push(ref(db,"messages"),{
      type:"text",text,sender:user.uid,
      email:user.email||"",
      timestamp:Date.now(),read:false
    });
    requestAnimationFrame(scrollBottom);
  }catch(e){
    input.value=text;
    alert("Message send nahi hua. Dobara try karo.");
    console.error(e);
  }
}

$("sendBtn").onclick=send;
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    send();
  }
});

input.addEventListener("input",()=>{
  clearTimeout(typingTimer);
  if(!user)return;
  if(!input.value.trim()){
    setTyping(false);
    return;
  }
  setTyping(true);
  typingTimer=setTimeout(()=>setTyping(false),1500);
});

$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password){
    $("error").textContent="Enter email and password.";
    return;
  }
  $("loginBtn").disabled=true;
  $("error").textContent="";
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    console.error(e);
    $("error").textContent="Login failed. Check email and password.";
  }finally{
    $("loginBtn").disabled=false;
  }
};

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("loginBtn").click();
});

$("logoutBtn").onclick=async()=>{
  if(!confirm("Logout?"))return;
  try{
    await setTyping(false);
    if(user){
      await set(ref(db,"messages/__presence__/"+user.uid),{
        online:false,lastSeen:Date.now()
      });
    }
    await signOut(auth);
  }catch(e){alert("Logout failed.");console.error(e)}
};

$("clearBtn").onclick=async()=>{
  if(!user)return;
  if(!confirm("Delete complete chat history for BOTH users? This cannot be undone."))return;
  try{
    // Preserve the special presence and typing nodes.
    const {get}=await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"
    );
    const snapshot=await get(ref(db,"messages"));
    const changes={};
    snapshot.forEach(child=>{
      if(!child.key.startsWith("__"))changes[child.key]=null;
    });
    if(Object.keys(changes).length){
      await update(ref(db,"messages"),changes);
    }
    resetMessages();
    showEmpty();
    alert("Chat history deleted for both users.");
  }catch(e){
    console.error(e);
    alert("Could not clear chat.");
  }
};

/* EMOJI */
const emojis=[
"😀","😂","🤣","😊","😍","🥰","😘","😉",
"😏","😌","😜","🤭","🫣","😈","🔥","❤️",
"💕","💗","💋","🥺","😚","😻","🫶","💞",
"✨","💫","🌹","🙈","😎","❤️‍🔥","😭","👍"
];

emojis.forEach(emoji=>{
  const btn=document.createElement("button");
  btn.textContent=emoji;
  btn.onclick=()=>{
    input.value+=emoji;
    input.dispatchEvent(new Event("input"));
    input.focus();
  };
  $("emojiGrid").appendChild(btn);
});

$("emojiBtn").onclick=()=>{
  const panel=$("emojiPanel");
  panel.style.display=panel.style.display==="block"?"none":"block";
};

/* KEYBOARD FIX */
function adjustViewport(){
  const viewport=window.visualViewport;
  if(!viewport)return;
  const height=viewport.height;
  const offset=viewport.offsetTop;
  const screen=$("chatScreen");
  screen.style.height=height+"px";
  screen.style.top=offset+"px";
  if(document.activeElement===input){
    requestAnimationFrame(scrollBottom);
  }
}

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",adjustViewport);
  window.visualViewport.addEventListener("scroll",adjustViewport);
}
window.addEventListener("resize",adjustViewport);
input.addEventListener("focus",()=>{
  setTimeout(adjustViewport,150);
  setTimeout(adjustViewport,350);
});

onAuthStateChanged(auth,async u=>{
  unsub.forEach(fn=>fn());
  unsub=[];
  clearTimeout(typingTimer);
  user=u;

  if(!u){
    $("loginScreen").classList.remove("hidden");
    $("chatScreen").classList.add("hidden");
    resetMessages();
    return;
  }

  if(u.uid!==USER1&&u.uid!==USER2){
    await signOut(auth);
    $("error").textContent="Unauthorized account.";
    return;
  }

  $("loginScreen").classList.add("hidden");
  $("chatScreen").classList.remove("hidden");

  resetMessages();
  otherPresence=null;
  otherTyping=false;
  refreshStatus();

  listenPresence();
  listenMessages();
  adjustViewport();
});
</script>
</body>
</html>
