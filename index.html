<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
    }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .login-box h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #1d4ed8;
    }

    #loginError {
      color: #dc2626;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    /* CHAT */
    #chatScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .chat-header {
      height: 65px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .chat-title {
      font-size: 19px;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .header-buttons button {
      border: none;
      background: rgba(255,255,255,0.18);
      color: white;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .header-buttons button:hover {
      background: rgba(255,255,255,0.28);
    }

    #logoutButton {
      background: #dc2626;
    }

    #clearChatButton {
      background: #b91c1c;
    }

    /* MESSAGES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 14px;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.4;
    }

    .message.mine {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.theirs {
      align-self: flex-start;
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .message-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .empty-chat {
      text-align: center;
      color: #888;
      margin-top: 40px;
      font-size: 14px;
    }

    /* INPUT */
    .chat-input-area {
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 15px;
      outline: none;
    }

    #sendButton {
      width: 50px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    .feature-button {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #eef2ff;
      cursor: pointer;
      font-size: 18px;
    }

    .feature-button:hover {
      background: #e0e7ff;
    }

    @media (max-width: 600px) {
      .chat-header {
        height: 60px;
      }

      .chat-title {
        font-size: 17px;
      }

      .header-buttons button {
        padding: 7px 8px;
        font-size: 12px;
      }

      .message {
        max-width: 85%;
      }

      #messages {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🔐 Private Chat</h2>

      <input
        type="email"
        id="emailInput"
        placeholder="Email"
        autocomplete="email"
      />

      <input
        type="password"
        id="passwordInput"
        placeholder="Password"
        autocomplete="current-password"
      />

      <button id="loginButton">Login</button>

      <div id="loginError"></div>
    </div>
  </div>


  <!-- CHAT SCREEN -->
  <div id="chatScreen">

    <div class="chat-header">

      <div class="chat-title">
        💬 Private Chat
      </div>

      <div class="header-buttons">

        <!-- GIF button - future use -->
        <button
          id="gifButton"
          title="GIF"
        >
          GIF
        </button>

        <!-- Video call skipped for now -->
        <button
          id="videoButton"
          title="Video Call"
        >
          📹
        </button>

        <!-- Clear complete history -->
        <button
          id="clearChatButton"
          title="Delete complete chat history"
        >
          🗑️
        </button>

        <button id="logoutButton">
          Logout
        </button>

      </div>
    </div>


    <!-- MESSAGES -->
    <div id="messages">
      <div id="emptyChat" class="empty-chat">
        No messages yet.
      </div>
    </div>


    <!-- MESSAGE INPUT -->
    <div class="chat-input-area">

      <button
        class="feature-button"
        id="emojiButton"
        title="Emoji"
      >
        😊
      </button>

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      />

      <button
        id="sendButton"
        title="Send"
      >
        ➤
      </button>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDNcItOQqGQOmDVToGJhvIt8_TZFXEhJyo",
      authDomain: "private-chat-4c4a8.firebaseapp.com",
      databaseURL: "https://private-chat-4c4a8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "private-chat-4c4a8",
      storageBucket: "private-chat-4c4a8.firebasestorage.app",
      messagingSenderId: "333493856166",
      appId: "1:333493856166:web:a753d6dfc6db986c8b9167"
    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const chatScreen =
      document.getElementById("chatScreen");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const logoutButton =
      document.getElementById("logoutButton");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const clearChatButton =
      document.getElementById("clearChatButton");

    const gifButton =
      document.getElementById("gifButton");

    const videoButton =
      document.getElementById("videoButton");

    const emojiButton =
      document.getElementById("emojiButton");


    /* =========================
       VARIABLES
    ========================= */

    let currentUser = null;

    let stopMessageListener = null;


    /* =========================
       LOGIN
    ========================= */

    loginButton.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      loginError.textContent = "";

      if (!email || !password) {

        loginError.textContent =
          "Please enter email and password.";

        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Login failed. Please check email and password.";

      }

      loginButton.disabled = false;
      loginButton.textContent = "Login";

    });


    /* =========================
       ENTER KEY LOGIN
    ========================= */

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {
          loginButton.click();
        }

      }
    );


    /* =========================
       AUTH STATE
    ========================= */

    onAuthStateChanged(auth, (user) => {

      currentUser = user;

      if (stopMessageListener) {

        stopMessageListener();

        stopMessageListener = null;
      }

      messages.innerHTML = "";

      if (user) {

        loginScreen.style.display = "none";

        chatScreen.style.display = "flex";

        startMessageListener();

        messageInput.focus();

      } else {

        loginScreen.style.display = "flex";

        chatScreen.style.display = "none";

      }

    });


    /* =========================
       REALTIME MESSAGE LISTENER
    ========================= */

    function startMessageListener() {

      const empty = document.createElement("div");

      empty.id = "emptyChat";

      empty.className = "empty-chat";

      empty.textContent = "No messages yet.";

      messages.appendChild(empty);


      stopMessageListener =
        onChildAdded(messagesRef, (snapshot) => {

          const data = snapshot.val();

          if (!data) return;

          const emptyChat =
            document.getElementById("emptyChat");

          if (emptyChat) {
            emptyChat.remove();
          }

          renderMessage(data);

        });

    }


    /* =========================
       RENDER MESSAGE
    ========================= */

    function renderMessage(data) {

      const message =
        document.createElement("div");

      const mine =
        currentUser &&
        data.sender === currentUser.uid;

      message.className =
        "message " +
        (mine ? "mine" : "theirs");


      const text =
        document.createElement("div");

      text.textContent =
        data.text || "";

      message.appendChild(text);


      if (data.timestamp) {

        const time =
          document.createElement("div");

        time.className =
          "message-time";

        const date =
          new Date(data.timestamp);

        time.textContent =
          date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          });

        message.appendChild(time);

      }


      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      if (!currentUser) return;

      const text =
        messageInput.value.trim();

      if (!text) return;

      sendButton.disabled = true;

      try {

        await push(messagesRef, {

          type: "text",

          text: text,

          sender: currentUser.uid,

          email: currentUser.email || "",

          timestamp: Date.now()

        });

        messageInput.value = "";

        messageInput.focus();

      } catch (error) {

        console.error(error);

        alert(
          "Message send nahi hua. Please try again."
        );

      }

      sendButton.disabled = false;

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================
       ENTER TO SEND
    ========================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       LOGOUT
    ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* =========================
       CLEAR COMPLETE CHAT
       Deletes history for BOTH users
    ========================= */

    clearChatButton.addEventListener(
      "click",
      async () => {

        if (!currentUser) return;


        const confirmed = confirm(
          "⚠️ Clear complete chat?\n\n" +
          "All messages will be permanently deleted for both users.\n\n" +
          "This action cannot be undone."
        );


        if (!confirmed) return;


        clearChatButton.disabled = true;

        clearChatButton.textContent =
          "Deleting...";


        try {

          await remove(messagesRef);


          messages.innerHTML = "";


          const empty =
            document.createElement("div");

          empty.id = "emptyChat";

          empty.className = "empty-chat";

          empty.textContent =
            "No messages yet.";


          messages.appendChild(empty);


          alert(
            "Complete chat history deleted."
          );


        } catch (error) {

          console.error(error);

          alert(
            "Could not clear chat. Please try again."
          );

        }


        clearChatButton.disabled = false;

        clearChatButton.textContent =
          "🗑️";

      }
    );


    /* =========================
       GIF BUTTON
       Provider/search later
    ========================= */

    gifButton.addEventListener(
      "click",
      () => {

        alert(
          "GIF feature baad mein add karenge."
        );

      }
    );


    /* =========================
       VIDEO BUTTON
       Skipped for now
    ========================= */

    videoButton.addEventListener(
      "click",
      () => {

        alert(
          "Video call feature abhi skip kiya hai."
        );

      }
    );


    /* =========================
       EMOJI BUTTON
    ========================= */

    emojiButton.addEventListener(
      "click",
      () => {

        messageInput.value += " 😊";

        messageInput.focus();

      }
    );

  </script>

</body>
</html>
