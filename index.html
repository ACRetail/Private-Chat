<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12091c">
  <title>Private Chat ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 0, 128, 0.18), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(130, 50, 255, 0.20), transparent 35%),
        linear-gradient(135deg, #09060d, #15091e 50%, #09060d);
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* ================= LOGIN ================= */

    #loginScreen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      padding: 38px 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      box-shadow:
        0 0 50px rgba(255, 0, 140, 0.12),
        0 25px 80px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .login-heart {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: linear-gradient(145deg, #ff1687, #7d25ff);
      box-shadow:
        0 0 25px rgba(255, 20, 140, 0.55),
        0 0 65px rgba(125, 37, 255, 0.30);
      animation: heartbeat 2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
    }

    .login-card h1 {
      font-size: 28px;
      margin-bottom: 7px;
      letter-spacing: 0.5px;
    }

    .login-card p {
      color: #c8baca;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .login-card input {
      width: 100%;
      padding: 15px 16px;
      margin-bottom: 13px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 15px;
      outline: none;
      background: rgba(0,0,0,0.28);
      color: white;
      font-size: 15px;
    }

    .login-card input::placeholder {
      color: #9b8ca2;
    }

    .login-card input:focus {
      border-color: #ff2b9a;
      box-shadow: 0 0 18px rgba(255, 43, 154, 0.18);
    }

    #loginButton {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff1687, #8c25ff);
      box-shadow: 0 8px 25px rgba(255, 0, 130, 0.25);
    }

    #loginButton:active {
      transform: scale(0.98);
    }

    #loginError {
      color: #ff7ebd;
      font-size: 13px;
      margin-top: 15px;
      min-height: 18px;
    }

    /* ================= CHAT APP ================= */

    #chatScreen {
      display: none;
      height: 100vh;
      width: 100%;
    }

    .chat-app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: rgba(10, 7, 14, 0.78);
      box-shadow: 0 0 100px rgba(255, 0, 140, 0.08);
      position: relative;
    }

    /* ================= HEADER ================= */

    .chat-header {
      min-height: 74px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: rgba(24, 12, 31, 0.92);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 5;
    }

    .avatar {
      width: 47px;
      height: 47px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      background: linear-gradient(145deg, #ff1687, #7c28ff);
      box-shadow: 0 0 20px rgba(255, 0, 130, 0.32);
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h2 {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    #statusText {
      font-size: 12px;
      color: #aaa0b1;
      margin-top: 3px;
    }

    #statusText.online {
      color: #ff63b4;
    }

    #statusText.typing {
      color: #ff4ca9;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      color: #eee;
      cursor: pointer;
      font-size: 17px;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 35, 150, 0.16);
      color: #ff69b9;
      box-shadow: 0 0 15px rgba(255, 35, 150, 0.15);
    }

    .logout-btn {
      font-size: 15px;
    }

    /* ================= MESSAGES ================= */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px 15px;
      scroll-behavior: smooth;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 0, 130, 0.055), transparent 35%);
    }

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: rgba(255, 55, 160, 0.25);
      border-radius: 20px;
    }

    .date-separator {
      width: fit-content;
      margin: 10px auto 16px;
      padding: 6px 13px;
      border-radius: 20px;
      background: rgba(255,255,255,0.07);
      color: #bcaebe;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .message-row {
      display: flex;
      margin-bottom: 9px;
      animation: messageIn 0.2s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .bubble {
      max-width: min(75%, 580px);
      padding: 9px 11px 7px;
      border-radius: 18px;
      position: relative;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.4;
    }

    .mine .bubble {
      background: linear-gradient(135deg, #a91869, #7623a6);
      border-bottom-right-radius: 5px;
      box-shadow: 0 5px 18px rgba(255, 0, 130, 0.10);
    }

    .theirs .bubble {
      background: rgba(255,255,255,0.085);
      border: 1px solid rgba(255,255,255,0.07);
      border-bottom-left-radius: 5px;
    }

    .message-text {
      padding-right: 48px;
      white-space: pre-wrap;
    }

    .message-meta {
      float: right;
      margin-left: 8px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
      color: rgba(255,255,255,0.62);
      font-size: 10px;
    }

    .ticks {
      font-size: 13px;
      letter-spacing: -4px;
      padding-right: 3px;
    }

    .ticks.read {
      color: #58c7ff;
    }

    /* ================= TYPING ================= */

    .typing-bubble {
      display: none;
      width: fit-content;
      padding: 9px 13px;
      margin-bottom: 8px;
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #ff5eb0;
      border-radius: 50%;
      animation: typingDot 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* ================= INPUT ================= */

    .input-area {
      padding: 10px 12px 12px;
      background: rgba(22, 11, 29, 0.96);
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      border-radius: 25px;
      background: rgba(255,255,255,0.075);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 0 5px 0 8px;
    }

    .emoji-btn,
    .gif-btn {
      border: none;
      background: transparent;
      color: #d6cbd8;
      cursor: pointer;
      font-size: 19px;
      width: 34px;
      height: 40px;
      flex-shrink: 0;
    }

    .gif-btn {
      font-size: 12px;
      font-weight: 800;
      color: #ff66b8;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 0 4px;
    }

    #messageInput::placeholder {
      color: #988c9e;
    }

    #sendButton {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff1687, #8425ff);
      color: white;
      cursor: pointer;
      font-size: 19px;
      box-shadow: 0 5px 20px rgba(255, 0, 130, 0.25);
      flex-shrink: 0;
    }

    #sendButton:active {
      transform: scale(0.92);
    }

    /* ================= EMOJI PANEL ================= */

    #emojiPanel {
      display: none;
      position: absolute;
      bottom: 76px;
      left: 12px;
      width: min(330px, calc(100% - 24px));
      padding: 12px;
      border-radius: 20px;
      background: rgba(27, 14, 35, 0.97);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 15px 50px rgba(0,0,0,0.45);
      z-index: 10;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }

    .emoji-grid button {
      border: none;
      background: transparent;
      font-size: 23px;
      cursor: pointer;
      padding: 5px;
      border-radius: 8px;
    }

    .emoji-grid button:hover {
      background: rgba(255,255,255,0.08);
    }

    /* ================= EMPTY ================= */

    .empty-chat {
      text-align: center;
      margin: 30vh auto 0;
      color: #9f92a4;
      font-size: 14px;
    }

    .empty-chat .heart {
      font-size: 38px;
      margin-bottom: 10px;
      opacity: 0.75;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {
      .chat-app {
        max-width: none;
      }

      .chat-header {
        min-height: 66px;
        padding: 8px 9px;
      }

      .avatar {
        width: 43px;
        height: 43px;
        font-size: 20px;
      }

      .header-info h2 {
        font-size: 15px;
      }

      #statusText {
        font-size: 11px;
      }

      .header-actions {
        gap: 2px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        font-size: 15px;
      }

      #messages {
        padding: 15px 9px 12px;
      }

      .bubble {
        max-width: 82%;
        font-size: 14.5px;
      }

      .input-area {
        padding: 8px 7px 9px;
      }

      .input-wrap {
        padding-left: 5px;
      }

      .emoji-btn,
      .gif-btn {
        width: 31px;
      }

      #sendButton {
        width: 43px;
        height: 43px;
      }
    }

    @media (max-width: 380px) {
      .header-actions .gif-head {
        display: none;
      }

      .header-actions .video-head {
        display: none;
      }

      .bubble {
        max-width: 87%;
      }

      .emoji-grid {
        grid-template-columns: repeat(7, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <section id="loginScreen">
    <div class="login-card">

      <div class="login-heart">❤️</div>

      <h1>Private Chat</h1>
      <p>Just two people. One private conversation.</p>

      <input
        type="email"
        id="emailInput"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        type="password"
        id="passwordInput"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton">Enter Private Chat 💜</button>

      <div id="loginError"></div>

    </div>
  </section>


  <!-- ================= CHAT ================= -->

  <section id="chatScreen">

    <div class="chat-app">

      <!-- HEADER -->
      <header class="chat-header">

        <div class="avatar">❤️</div>

        <div class="header-info">
          <h2>Private Chat</h2>
          <div id="statusText">Offline</div>
        </div>

        <div class="header-actions">

          <button
            class="icon-btn gif-head"

          <button

          <button
            class="icon-btn"

          <button

        </div>

      </header>


      <!-- MESSAGES -->
      <main id="messages">

        <div class="typing-bubble" id="typingBubble">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

      </main>


      <!-- EMOJI PANEL -->
      <div id="emojiPanel">
        <div class="emoji-grid">

          <button>😀</button>
          <button>😂</button>
          <button>🤣</button>
          <button>😊</button>
          <button>😍</button>
          <button>🥰</button>
          <button>😘</button>
          <button>😉</button>

          <button>😏</button>
          <button>😌</button>
          <button>😜</button>
          <button>🤭</button>
          <button>🫣</button>
          <button>😈</button>
          <button>🔥</button>
          <button>❤️</button>

          <button>💕</button>
          <button>💗</button>
          <button>💋</button>
          <button>🥺</button>
          <button>😚</button>
          <button>😻</button>
          <button>🫶</button>
          <button>💞</button>

          <button>✨</button>
          <button>💫</button>
          <button>🌹</button>
          <button>😘</button>
          <button>🙈</button>
          <button>😉</button>
          <button>😎</button>
          <button>❤️‍🔥</button>

        </div>
      </div>


      <!-- INPUT -->
      <footer class="input-area">

        <div class="input-wrap">

          <button
            class="emoji-btn"

          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."

          >

          <button
            class="gif-btn"
            id="gifButton"
            title="GIF"
          >GIF</button>

        </div>

        <button id="sendButton" title="Send">➤</button>

      </footer>

    </div>

  </section>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded,
      onChildChanged,
      onValue,
      set,
      update,
      remove,
      onDisconnect
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* ================= FIREBASE CONFIG ================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDNcIt8_TZFXEhJyo",
      authDomain: "private-chat-4c4a8.firebaseapp.com",
      databaseURL: "https://private-chat-4c4a8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "private-chat-4c4a8",
      storageBucket: "private-chat-4c4a8.firebasestorage.app",
      messagingSenderId: "333493856166",
      appId: "1:333493856166:web:a753d6dfc6db986c8b9167"
    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const database = getDatabase(app);


    /* ================= USERS ================= */

    const USER_1 = "4kQ8bajQmPgYzhej526WHTofvWW2";
    const USER_2 = "4S0l5VRvoPQdQ1qE8XaypIZprD33";


    /* ================= DOM ================= */

    const loginScreen = document.getElementById("loginScreen");
    const chatScreen = document.getElementById("chatScreen");

    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");

    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");

    const logoutButton = document.getElementById("logoutButton");
    const clearChatButton = document.getElementById("clearChatButton");

    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    const statusText = document.getElementById("statusText");

    const typingBubble = document.getElementById("typingBubble");

    const emojiButton = document.getElementById("emojiButton");
    const emojiPanel = document.getElementById("emojiPanel");

    const gifButton = document.getElementById("gifButton");
    const gifHeaderButton = document.getElementById("gifHeaderButton");

    const videoButton = document.getElementById("videoButton");


    /* ================= STATE ================= */

    let currentUser = null;

    let stopMessageListener = null;
    let stopChangedListener = null;
    let stopPresenceListener = null;
    let stopTypingListener = null;

    let typingTimer = null;

    let otherUserOnline = false;
    let otherUserLastSeen = null;

    let knownDates = new Set();


    /* ================= HELPERS ================= */

    function getOtherUserId() {
      if (!currentUser) return null;

      return currentUser.uid === USER_1
        ? USER_2
        : USER_1;
    }


    function formatTime(timestamp) {

      if (!timestamp) return "";

      const date = new Date(timestamp);

      return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }


    function getDateKey(timestamp) {

      const date = new Date(timestamp);

      return [
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      ].join("-");
    }


    function getDateLabel(timestamp) {

      const date = new Date(timestamp);

      const now = new Date();

      const todayKey = getDateKey(now);

      const yesterday = new Date();
      yesterday.setDate(now.getDate() - 1);

      const yesterdayKey = getDateKey(yesterday);

      const key = getDateKey(timestamp);

      if (key === todayKey) {
        return "Today";
      }

      if (key === yesterdayKey) {
        return "Yesterday";
      }

      return date.toLocaleDateString([], {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }


    function formatLastSeen(timestamp) {

      if (!timestamp) {
        return "Offline";
      }

      const date = new Date(timestamp);

      const now = new Date();

      const diff = Math.floor(
        (now.getTime() - date.getTime()) / 1000
      );

      if (diff < 60) {
        return "last seen just now";
      }

      if (diff < 3600) {
        const minutes = Math.floor(diff / 60);
        return `last seen ${minutes} min ago`;
      }

      if (getDateKey(timestamp) === getDateKey(now)) {
        return "last seen today at " + formatTime(timestamp);
      }

      return "last seen " + date.toLocaleDateString([], {
        day: "numeric",
        month: "short"
      }) + " at " + formatTime(timestamp);
    }


    function scrollToBottom() {

      setTimeout(() => {
        messages.scrollTop = messages.scrollHeight;
      }, 30);
    }


    function setStatus(text, className = "") {

      statusText.textContent = text;
      statusText.className = className;
    }


    /* ================= LOGIN ================= */

    loginButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        loginError.textContent = "Please enter email and password.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Entering...";

      loginError.textContent = "";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Login failed. Please check your email and password.";

      }

      loginButton.disabled = false;
      loginButton.textContent = "Enter Private Chat 💜";
    });


    passwordInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        loginButton.click();
      }

    });


    /* ================= PRESENCE ================= */

    async function startPresence() {

      if (!currentUser) return;

      const uid = currentUser.uid;

      const presenceRef = ref(
        database,
        "messages/__presence__/" + uid
      );

      await set(presenceRef, {
        online: true,
        lastSeen: Date.now()
      });

      onDisconnect(presenceRef).set({
        online: false,
        lastSeen: Date.now()
      });
    }


    function startOtherUserPresence() {

      if (!currentUser) return;

      const otherUid = getOtherUserId();

      const presenceRef = ref(
        database,
        "messages/__presence__/" + otherUid
      );

      if (stopPresenceListener) {
        stopPresenceListener();
      }

      stopPresenceListener = onValue(
        presenceRef,
        (snapshot) => {

          const data = snapshot.val();

          otherUserOnline = !!(data && data.online);

          otherUserLastSeen =
            data && data.lastSeen
              ? data.lastSeen
              : null;

          restorePresenceText();
        }
      );
    }


    function restorePresenceText() {

      if (!currentUser) return;

      if (typingBubble.style.display === "block") {
        setStatus("typing...", "typing");
        return;
      }

      if (otherUserOnline) {

        setStatus("online", "online");

      } else {

        setStatus(
          formatLastSeen(otherUserLastSeen),
          ""
        );
      }
    }


    /* ================= TYPING ================= */

    async function setTyping(value) {

      if (!currentUser) return;

      const typingRef = ref(
        database,
        "messages/__typing__/" + currentUser.uid
      );

      await set(typingRef, {
        typing: value,
        timestamp: Date.now()
      });

      if (value) {

        onDisconnect(typingRef).set({
          typing: false,
          timestamp: Date.now()
        });

      }
    }


    function startTypingListener() {

      if (!currentUser) return;

      const otherUid = getOtherUserId();

      const typingRef = ref(
        database,
        "messages/__typing__/" + otherUid
      );

      if (stopTypingListener) {
        stopTypingListener();
      }

      stopTypingListener = onValue(
        typingRef,
        (snapshot) => {

          const data = snapshot.val();

          const isTyping =
            data &&
            data.typing === true;

          if (isTyping) {

            typingBubble.style.display = "block";

            setStatus(
              "typing...",
              "typing"
            );

            scrollToBottom();

          } else {

            typingBubble.style.display = "none";

            restorePresenceText();
          }

        }
      );
    }


    messageInput.addEventListener("input", () => {

      if (!currentUser) return;

      const hasText =
        messageInput.value.trim().length > 0;

      if (!hasText) {

        clearTimeout(typingTimer);
        setTyping(false);
        return;
      }

      setTyping(true);

      clearTimeout(typingTimer);

      typingTimer = setTimeout(() => {
        setTyping(false);
      }, 1200);
    });


    /* ================= MESSAGES ================= */

    function createDateSeparator(timestamp) {

      const dateKey = getDateKey(timestamp);

      if (knownDates.has(dateKey)) {
        return;
      }

      knownDates.add(dateKey);

      const separator =
        document.createElement("div");

      separator.className = "date-separator";

      separator.dataset.dateKey = dateKey;

      separator.textContent =
        getDateLabel(timestamp);

      messages.insertBefore(
        separator,
        typingBubble
      );
    }


    function renderMessage(key, data) {

      if (!data || !data.text) return;

      const existing =
        document.querySelector(
          `[data-message-id="${key}"]`
        );

      if (existing) {
        updateMessageUI(existing, data);
        return;
      }

      createDateSeparator(data.timestamp);

      const row =
        document.createElement("div");

      const isMine =
        data.sender === currentUser.uid;

      row.className =
        "message-row " +
        (isMine ? "mine" : "theirs");

      row.dataset.messageId = key;

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      const text =
        document.createElement("div");

      text.className = "message-text";

      text.textContent = data.text;

      const meta =
        document.createElement("div");

      meta.className = "message-meta";

      const time =
        document.createElement("span");

      time.textContent =
        formatTime(data.timestamp);

      meta.appendChild(time);

      if (isMine) {

        const ticks =
          document.createElement("span");

        ticks.className =
          "ticks " +
          (data.read ? "read" : "");

        ticks.textContent =
          data.read ? "✓✓" : "✓";

        meta.appendChild(ticks);
      }

      bubble.appendChild(text);
      bubble.appendChild(meta);

      row.appendChild(bubble);

      messages.insertBefore(
        row,
        typingBubble
      );

      scrollToBottom();

      /* Recipient has received the message */
      if (
        !isMine &&
        data.read !== true
      ) {

        update(
          ref(
            database,
            "messages/" + key
          ),
          {
            read: true
          }
        ).catch(error => {
          console.error(error);
        });
      }
    }


    function updateMessageUI(row, data) {

      if (!currentUser) return;

      if (data.sender !== currentUser.uid) {
        return;
      }

      const ticks =
        row.querySelector(".ticks");

      if (!ticks) return;

      if (data.read) {

        ticks.textContent = "✓✓";

        ticks.classList.add("read");

      } else {

        ticks.textContent = "✓";

        ticks.classList.remove("read");
      }
    }


    function startMessages() {

      if (!currentUser) return;

      const messagesRef =
        ref(database, "messages");

      if (stopMessageListener) {
        stopMessageListener();
      }

      if (stopChangedListener) {
        stopChangedListener();
      }

      stopMessageListener =
        onChildAdded(
          messagesRef,
          (snapshot) => {

            const key = snapshot.key;

            const data = snapshot.val();

            if (
              key === "__presence__" ||
              key === "__typing__"
            ) {
              return;
            }

            renderMessage(key, data);
          }
        );


      stopChangedListener =
        onChildChanged(
          messagesRef,
          (snapshot) => {

            const key = snapshot.key;

            const data = snapshot.val();

            if (
              key === "__presence__" ||
              key === "__typing__"
            ) {
              return;
            }

            const row =
              document.querySelector(
                `[data-message-id="${key}"]`
              );

            if (row) {
              updateMessageUI(row, data);
            }
          }
        );
    }


    /* ================= SEND ================= */

    async function sendMessage() {

      if (!currentUser) return;

      const text =
        messageInput.value.trim();

      if (!text) return;

      try {

        await push(
          ref(database, "messages"),
          {
            type: "text",
            text: text,
            sender: currentUser.uid,
            email: currentUser.email || "",
            timestamp: Date.now(),
            read: false
          }
        );

        messageInput.value = "";

        clearTimeout(typingTimer);

        await setTyping(false);

        emojiPanel.style.display = "none";

        messageInput.focus();

      } catch (error) {

        console.error(error);

        alert(
          "Message send nahi hua. Please try again."
        );
      }
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }

      }
    );


    /* ================= EMOJI ================= */

    emojiButton.addEventListener(
      "click",
      (event) => {

        event.stopPropagation();

        emojiPanel.style.display =
          emojiPanel.style.display === "block"
            ? "none"
            : "block";
      }
    );


    document
      .querySelectorAll(".emoji-grid button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            messageInput.value +=
              button.textContent;

            messageInput.focus();

            messageInput.dispatchEvent(
              new Event("input")
            );
          }
        );

      });


    document.addEventListener(
      "click",
      (event) => {

        if (
          !emojiPanel.contains(event.target) &&
          event.target !== emojiButton
        ) {

          emojiPanel.style.display = "none";
        }

      }
    );


    /* ================= GIF PLACEHOLDER ================= */

    function gifComingSoon() {

      alert(
        "GIF search feature baad mein add karenge. ❤️"
      );
    }


    gifButton.addEventListener(
      "click",
      gifComingSoon
    );

    gifHeaderButton.addEventListener(
      "click",
      gifComingSoon
    );


    /* ================= VIDEO PLACEHOLDER ================= */

    videoButton.addEventListener(
      "click",
      () => {

        alert(
          "Video call feature abhi skip kiya hai. ❤️"
        );

      }
    );


    /* ================= CLEAR COMPLETE CHAT ================= */

    clearChatButton.addEventListener(
      "click",
      async () => {

        if (!currentUser) return;

        const confirmed =
          confirm(
            "⚠️ Clear complete chat?\n\n" +
            "All messages will be permanently deleted for both users.\n\n" +
            "This action cannot be undone."
          );

        if (!confirmed) return;

        clearChatButton.disabled = true;

        clearChatButton.textContent =
          "⏳";

        try {

          await remove(
            ref(database, "messages")
          );

          messages.innerHTML = "";

          messages.appendChild(
            typingBubble
          );

          typingBubble.style.display =
            "none";

          knownDates.clear();

          const empty =
            document.createElement("div");

          empty.className =
            "empty-chat";

          empty.innerHTML =
            '<div class="heart">❤️</div>' +
            '<div>No messages yet.</div>';

          messages.insertBefore(
            empty,
            typingBubble
          );

          await startPresence();

          await setTyping(false);

          alert(
            "Complete chat history deleted."
          );

        } catch (error) {

          console.error(error);

          alert(
            "Could not clear chat. Please try again."
          );
        }

        clearChatButton.disabled = false;

        clearChatButton.textContent =
          "🗑️";
      }
    );


    /* ================= LOGOUT ================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        if (!currentUser) return;

        const confirmed =
          confirm(
            "Logout from Private Chat?"
          );

        if (!confirmed) return;

        try {

          await setTyping(false);

          await set(
            ref(
              database,
              "messages/__presence__/" +
              currentUser.uid
            ),
            {
              online: false,
              lastSeen: Date.now()
            }
          );

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* ================= AUTH STATE ================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        currentUser = user;

        if (user) {

          if (
            user.uid !== USER_1 &&
            user.uid !== USER_2
          ) {

            alert(
              "This private chat is restricted to the two authorized users."
            );

            await signOut(auth);

            return;
          }


          loginScreen.style.display =
            "none";

          chatScreen.style.display =
            "block";


          /* Stop old listeners */

          if (stopMessageListener) {
            stopMessageListener();
            stopMessageListener = null;
          }

          if (stopChangedListener) {
            stopChangedListener();
            stopChangedListener = null;
          }

          if (stopPresenceListener) {
            stopPresenceListener();
            stopPresenceListener = null;
          }

          if (stopTypingListener) {
            stopTypingListener();
            stopTypingListener = null;
          }


          /* Reset messages safely */

          messages.innerHTML = "";

          messages.appendChild(
            typingBubble
          );

          typingBubble.style.display =
            "none";

          knownDates.clear();


          /* Start systems */

          await startPresence();

          startOtherUserPresence();

          startTypingListener();

          startMessages();

          messageInput.focus();

        } else {

          loginScreen.style.display =
            "flex";

          chatScreen.style.display =
            "none";

          messages.innerHTML = "";

          messages.appendChild(
            typingBubble
          );

          typingBubble.style.display =
            "none";

          knownDates.clear();

          setStatus("Offline");

        }

      }
    );

  </script>

</body>
</html>
