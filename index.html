<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 800px;
      background: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #075e54;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .name {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 3px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      border: none;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
      padding: 6px;
    }

    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .message {
      max-width: 75%;
      padding: 9px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .received {
      background: white;
      margin-right: auto;
      border-top-left-radius: 3px;
    }

    .sent {
      background: #dcf8c6;
      margin-left: auto;
      border-top-right-radius: 3px;
    }

    .time {
      display: block;
      font-size: 10px;
      color: #777;
      text-align: right;
      margin-top: 4px;
    }

    .input-area {
      padding: 10px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gif-btn {
      border: none;
      background: white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-weight: bold;
      color: #075e54;
    }

    .message-input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 15px;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #075e54;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    @media (min-width: 501px) {
      .chat-app {
        height: 90vh;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.15);
      }
    }
  </style>
</head>

<body>

  <div class="chat-app">

    <header class="header">

      <div class="user-info">
        <div class="avatar">P</div>

        <div>
          <div class="name">Private Chat</div>
          <div class="status">Online</div>
        </div>
      </div>

      <div class="header-buttons">
        <button class="header-btn" onclick="startVideoCall()">📹</button>
      </div>

    </header>

    <main class="chat" id="chat">

      <div class="message received">
        Hello! 👋
        <span class="time">Now</span>
      </div>

    </main>

    <div class="input-area">

      <button class="gif-btn" onclick="openGif()">GIF</button>

      <input
        type="text"
        id="messageInput"
        class="message-input"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button class="send-btn" onclick="sendMessage()">➤</button>

    </div>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      const message = document.createElement("div");
      message.className = "message sent";

      message.innerHTML = `
        ${escapeHtml(text)}
        <span class="time">Now ✓</span>
      `;

      chat.appendChild(message);

      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function openGif() {
      alert("GIF feature next step mein add karenge 😊");
    }

    function startVideoCall() {
      alert("Video Call next step mein connect karenge 📹");
    }
  </script>

</body>
</html>
