<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      height: 100vh;
    }

    .chat-app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #075e54;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .name {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      margin-top: 3px;
      opacity: .85;
    }

    .call-btn {
      border: none;
      background: transparent;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .message {
      max-width: 75%;
      padding: 9px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      font-size: 15px;
      word-wrap: break-word;
    }

    .sent {
      background: #dcf8c6;
      margin-left: auto;
      border-top-right-radius: 3px;
    }

    .received {
      background: white;
      margin-right: auto;
      border-top-left-radius: 3px;
    }

    .time {
      display: block;
      font-size: 10px;
      color: #777;
      text-align: right;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #f0f0f0;
    }

    .message-input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 15px;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #075e54;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .gif-btn {
      width: 42px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #075e54;
      font-weight: bold;
      cursor: pointer;
    }

    @media (min-width: 501px) {
      .chat-app {
        height: 90vh;
        margin-top: 5vh;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 25px rgba(0,0,0,.15);
      }
    }
  </style>
</head>

<body>

<div class="chat-app">

  <header class="header">

    <div class="user-info">
      <div class="avatar">P</div>

      <div>
        <div class="name">Private Chat</div>
        <div class="status" id="status">Connecting...</div>
      </div>
    </div>

    <button class="call-btn" onclick="alert('Video call next step mein add karenge 📹')">
      📹
    </button>

  </header>

  <main class="chat" id="chat"></main>

  <div class="input-area">

    <button class="gif-btn" onclick="alert('GIF next step mein add karenge 😊')">
      GIF
    </button>

    <input
      id="messageInput"
      class="message-input"
      type="text"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button class="send-btn" id="sendBtn">
      ➤
    </button>

  </div>

</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    onChildAdded
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDNcItOQqGQOmDVToGJhvIt8_TZFXEhJyo",
    authDomain: "private-chat-4c4a8.firebaseapp.com",
    databaseURL: "https://private-chat-4c4a8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "private-chat-4c4a8",
    storageBucket: "private-chat-4c4a8.firebasestorage.app",
    messagingSenderId: "333493856166",
    appId: "1:333493856166:web:a753d6dfc6db986c8b9167"
  };


  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const messagesRef = ref(db, "messages");

  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const status = document.getElementById("status");


  status.textContent = "Connected";


  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    push(messagesRef, {
      text: text,
      sender: "user",
      timestamp: Date.now()
    });

    input.value = "";
    input.focus();
  }


  sendBtn.addEventListener("click", sendMessage);


  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });


  onChildAdded(messagesRef, function(snapshot) {

    const data = snapshot.val();

    const message = document.createElement("div");

    message.className =
      data.sender === "user"
        ? "message sent"
        : "message received";


    const text = document.createElement("span");
    text.textContent = data.text;


    const time = document.createElement("span");
    time.className = "time";

    const date = new Date(data.timestamp);

    time.textContent =
      date.getHours().toString().padStart(2, "0") +
      ":" +
      date.getMinutes().toString().padStart(2, "0");


    message.appendChild(text);
    message.appendChild(time);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

  });

</script>

</body>
</html>
